server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API проксируем на backend внутри docker-сети — фронт и API на одном origin,
    # CORS не нужен.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные изображения товаров отдаёт backend с диска (том uploads).
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Лимит на размер загружаемого файла (совпадает с multipart на backend).
    client_max_body_size 12m;

    # SPA: все остальные пути отдаём index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
